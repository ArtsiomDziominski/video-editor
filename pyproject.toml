[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-video-editor"
version = "0.1.0"
description = "Claude Видеоредактор — локальный редактор проектов вертикальных роликов: озвучка VoxCPM2, тексты, тайминги, сборка MP4"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy", "opencv-python", "pillow", "scipy", "soundfile", "imageio-ffmpeg",
    "librosa", "transformers", "torch", "voxcpm",
]

[project.scripts]
claude-video-editor = "claude_video_editor.app:main"

[tool.setuptools.packages.find]
include = ["claude_video_editor*"]

[tool.setuptools.package-data]
claude_video_editor = ["ui.html"]
